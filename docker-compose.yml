services:
  api:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - rembg-model-cache:/root/.u2net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  rembg-model-cache:
